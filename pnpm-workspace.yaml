# Simple RSS is deliberately one package. This file only carries pnpm
# settings, which pnpm 11 no longer reads from package.json.
allowBuilds:
  # Ships a prebuilt binary for every platform we run on and loads it before any
  # local build, so compiling only adds a C toolchain requirement.
  better-sqlite3: false
  esbuild: true
patchedDependencies:
  # Inline math as `$$…$$` so a currency `$` never opens math (667a7eb); tests/server/reader/reader.test.ts "returns the supported Reader dialect…" guards it.
  defuddle@0.19.3: patches/defuddle@0.19.3.patch
overrides:
  # defuddle -> mathml-to-latex parses untrusted article HTML for Reader; 0.9.12 fixes its quadratic-time and ReDoS advisories, and mathml-to-latex's ^0.9.10 range would allow older.
  '@xmldom/xmldom': ^0.9.12
