# Simple RSS is deliberately one package. This file only carries pnpm
# settings, which pnpm 11 no longer reads from package.json.
allowBuilds:
  better-sqlite3: true
  esbuild: true
patchedDependencies:
  # Inline math as `$$…$$` so a currency `$` never opens math (667a7eb); tests/server/reader/reader.test.ts "returns the supported Reader dialect…" guards it.
  defuddle@0.19.3: patches/defuddle@0.19.3.patch
