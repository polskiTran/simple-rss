name: Container

# Builds the production image and runs the smoke suite only when something
# that shapes the image or its server changes. Client-only changes are covered
# by `pnpm build` in CI, and release.yml reruns this suite on every tag before
# publishing, so nothing ships without it.

on:
  push:
    branches: ['**']
    paths: &image-inputs
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
      - tsconfig.server.json
      - src/server/**
      - tests/smoke/**
      - vitest.smoke.config.ts
      - .github/workflows/container.yml
  pull_request:
    paths: *image-inputs

jobs:
  container:
    name: Container smoke tests (linux/amd64)
    # ubuntu-26.04 is amd64, so the image these tests build and run is the
    # same architecture the released image targets.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:smoke
      - name: Confirm the built image targets linux/amd64
        run: |
          test "$(docker image inspect simple-rss:smoke --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
